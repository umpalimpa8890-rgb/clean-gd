name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          geode: 5.0.0
          platform: win
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/*.geode
