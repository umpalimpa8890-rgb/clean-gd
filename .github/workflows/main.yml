name: Build
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@v5
        with:
          sdk: v5.3.0
          bindings: v5.3.0
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/*.geode
